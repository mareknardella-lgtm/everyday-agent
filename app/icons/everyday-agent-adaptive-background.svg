<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Everyday Agent adaptive icon background</title>
  <desc id="desc">Deep navy gradient background for an Android adaptive icon.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#131C3A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
</svg>
